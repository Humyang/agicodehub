<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Align Video/Image</title>
    <script src="./vendor/fabric.min.js"></script>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #1a1a1a;
            color: #eee;
        }

        /* 顶部工具栏 */
        .toolbar {
            background: #262626;
            padding: 10px 20px;
            border-bottom: 1px solid #333;
            display: flex;
            gap: 12px;
            align-items: flex-end;
            flex-wrap: wrap;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 11px;
            color: #aaa;
            margin-bottom: 4px;
        }

        .form-group input[type="text"],
        .form-group input[type="number"],
        .form-group select {
            background: #111;
            border: 1px solid #444;
            color: white;
            padding: 6px;
            border-radius: 4px;
            font-size: 13px;
        }

        .form-group input[type="color"] {
            background: #111;
            border: 1px solid #444;
            height: 30px;
            width: 40px;
            padding: 0;
            cursor: pointer;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            background: #404040;
            color: white;
            transition: 0.2s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .btn:hover {
            background: #525252;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary {
            background: #2563eb;
        }

        .btn-primary:hover {
            background: #1d4ed8;
        }

        .btn-success {
            background: #059669;
        }

        .btn-success:hover {
            background: #047857;
        }

        /* 主布局 */
        .main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* 左侧列表 */
        .sidebar {
            width: 280px;
            background: #202020;
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 10px;
            font-size: 12px;
            color: #888;
            border-bottom: 1px solid #333;
            background: #181818;
        }

        .layer-list {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            flex: 1;
        }

        .layer-item {
            padding: 6px 10px;
            border-bottom: 1px solid #2a2a2a;
            cursor: default;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #202020;
            user-select: none;
            font-size: 13px;
            transition: background 0.1s;
        }

        .layer-item:hover {
            background: #2d2d2d;
        }

        .layer-item.active {
            background: #3b82f6;
            color: white;
        }

        .layer-item.dragging {
            opacity: 0.5;
            background: #444;
            border: 1px dashed #666;
        }

        .layer-item.hidden-layer {
            opacity: 0.5;
        }

        /* 列表内控件 */
        .layer-left {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            overflow: hidden;
            cursor: grab;
        }

        .layer-name {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .layer-actions {
            display: flex;
            gap: 5px;
        }

        .icon-btn {
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            font-size: 14px;
            line-height: 1;
            color: #aaa;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .type-badge {
            font-size: 9px;
            padding: 2px 4px;
            border-radius: 3px;
            text-transform: uppercase;
        }

        .badge-img {
            background: #059669;
            color: white;
        }

        .badge-vid {
            background: #d97706;
            color: white;
        }

        /* 右侧面板 */
        .right-panel {
            width: 200px;
            background: #202020;
            border-left: 1px solid #333;
            display: flex;
            flex-direction: column;
            padding: 15px;
            display: none;
        }

        .panel-title {
            font-size: 12px;
            font-weight: bold;
            color: #aaa;
            margin-bottom: 10px;
            text-transform: uppercase;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }

        .quick-btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 20px;
        }

        .quick-btn {
            background: #333;
            border: 1px solid #444;
            color: #ddd;
            padding: 6px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .quick-btn:hover {
            background: #444;
            border-color: #666;
        }

        /* 画布 */
        .workspace {
            flex: 1;
            background: #111;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #workspaceContainer {
            background-image: linear-gradient(45deg, #222 25%, transparent 25%), linear-gradient(-45deg, #222 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #222 75%), linear-gradient(-45deg, transparent 75%, #222 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            background-color: #333;
        }

        .tip {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 12px;
            pointer-events: none;
            z-index: 100;
            border: 1px solid #444;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            text-align: center;
            white-space: nowrap;
        }

        /* 代码区 */
        .code-panel {
            height: 180px;
            /* 增加高度以适应新的控制 */
            background: #0d0d0d;
            border-top: 1px solid #333;
            display: flex;
            flex-direction: column;
            padding: 10px;
        }

        .code-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 12px;
            color: #aaa;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .code-controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        textarea {
            flex: 1;
            background: #000;
            color: #a5f3fc;
            border: 1px solid #333;
            padding: 10px;
            resize: none;
            font-family: monospace;
            white-space: pre;
            overflow-x: auto;
            font-size: 12px;
        }
    </style>
</head>

<body>


    <div class="toolbar">
        <!-- Project Save Settings -->
        <div class="form-group"
            style="flex-direction: row; gap: 5px; align-items: flex-end; margin-right: 15px; border-right: 1px solid #444; padding-right: 15px;">
            <div class="form-group">
                <label>Project Name (JSON)</label>
                <input type="text" id="exportName" value="project" style="width: 80px;" placeholder="Save filename">
            </div>
            <button class="btn" onclick="saveProject()" title="Save as .json project file">💾 Save</button>
            <button class="btn" onclick="document.getElementById('loadInput').click()"
                title="Load .json project file">📂
                Open</button>
            <input type="file" id="loadInput" accept=".json" style="display:none" onchange="loadProject(this)">
        </div>

        <!-- Crop Dimensions -->
        <div class="form-group">
            <label>Crop Width</label>
            <input type="number" id="cropW" value="500" style="width: 50px;" oninput="updateCropFrame()">
        </div>
        <div class="form-group">
            <label>Crop Height</label>
            <input type="number" id="cropH" value="500" style="width: 50px;" oninput="updateCropFrame()">
        </div>

        <!-- Output Path Configuration -->
        <div class="form-group">
            <label>Output Folder</label>
            <input type="text" id="outputDir" value="output" style="width: 60px;" oninput="generateBatchCode()"
                title="Generated folder name">
        </div>
        <div class="form-group">
            <label>Filename Suffix</label>
            <input type="text" id="outSuffix" value="_crop" style="width: 60px;" oninput="generateBatchCode()"
                title="e.g., _v1, leave empty for no suffix">
        </div>
        <div class="form-group">
            <label>Local Path Prefix</label>
            <input type="text" id="basePath" value="" placeholder="C:\videos\" style="width: 100px;"
                oninput="generateBatchCode()">
        </div>

        <button class="btn btn-success" onclick="document.getElementById('fileInput').click()"
            style="margin-left: 10px;">+ Upload Media</button>
        <input type="file" id="fileInput" multiple accept="image/*,video/*" style="display:none"
            onchange="handleUpload(this.files)">

        <div style="flex:1"></div>

        <div class="form-group" style="flex-direction: row; gap: 5px; align-items: flex-end;">
            <button class="btn" id="btnUndo" onclick="undo()" disabled title="Ctrl+Z">↩</button>
            <button class="btn" id="btnRedo" onclick="redo()" disabled title="Ctrl+Y">↪</button>
            <button class="btn btn-primary" onclick="copyCode()">Copy Code</button>
            <button class="btn btn-copy" onclick="runFFmpegCommand()">📋 Run On Vscode</button>
        </div>
    </div>

    <div class="main">
        <div class="sidebar">
            <div class="sidebar-header">
                <span>Layer List (Drag to Sort)</span>
                <span style="float:right; cursor:pointer; color:#ef4444;" onclick="deleteActive()">Delete</span>
            </div>
            <ul class="layer-list" id="layerList"></ul>
        </div>

        <div class="workspace" id="workspaceContainer">
            <div class="tip">
                <span style="color:#60a5fa">↑↓←→</span> Move Media <span style="margin:0 5px;color:#444">|</span>
                <span style="color:#60a5fa">[ ]</span> Scale Media <span style="margin:0 5px;color:#444">|</span>
                <span style="color:#60a5fa">Alt+Drag</span> Pan View
            </div>
            <canvas id="c"></canvas>
        </div>

        <div class="right-panel" id="rightPanel">
            <div class="panel-title">Quick Adjust</div>
            <div class="quick-btn-grid">
                <button class="quick-btn" onclick="applyPreset('fill')">Fill Red Frame</button>
                <button class="quick-btn" onclick="applyPreset('fit')">Fit Red Frame</button>
                <button class="quick-btn" onclick="applyPreset('w_fill')">Width Fill</button>
                <button class="quick-btn" onclick="applyPreset('h_fill')">Height Fill</button>
            </div>
            <div class="panel-title">Alignment</div>
            <div class="quick-btn-grid">
                <button class="quick-btn" onclick="applyPreset('center')">Center</button>
                <button class="quick-btn" onclick="applyPreset('reset')">Original Ratio</button>
            </div>
            <div style="font-size:12px; color:#666; margin-top:10px;">
                Selected: <span id="activeObjectName" style="color:#aaa;">-</span>
            </div>
        </div>
    </div>

    <div class="code-panel">
        <div class="code-header">
            <span style="font-weight: bold; color: #fff;">FFmpeg Command Preview</span>

            <div class="code-controls">
                <!-- Format Selection -->
                <div class="form-group" style="flex-direction: row; align-items: center; gap: 5px;">
                    <label style="margin:0;">Format:</label>
                    <select id="outExt" onchange="generateBatchCode()" style="width: 80px;">
                        <option value=".png">.png (Image)</option>
                        <option value=".mp4">.mp4 (Video)</option>
                        <option value=".webp">.webp (Animated)</option>
                        <option value=".webm">.webm (WebM)</option>
                        <option value=".mov">.mov (ProRes)</option>
                        <option value=".jpg">.jpg (Image)</option>
                    </select>
                </div>

                <!-- Background Color Settings -->
                <div class="form-group"
                    style="flex-direction: row; align-items: center; gap: 5px; border-left: 1px solid #333; padding-left: 10px;">
                    <label style="margin:0;" title="Only effective for PNG/MP4/WebP">Background:</label>
                    <input type="color" id="bgColor" value="#000000" oninput="generateBatchCode()"
                        title="Select background color">
                    <div style="display:flex; align-items:center;">
                        <input type="checkbox" id="bgTransparent" checked onchange="generateBatchCode()"
                            style="margin:0 4px 0 0;">
                        <label for="bgTransparent" style="margin:0; cursor:pointer;">Transparent (if supported)</label>
                    </div>
                </div>
            </div>
        </div>
        <textarea id="ffmpegCommandInput" readonly
            placeholder="Code will appear here after uploading media and making adjustments..."></textarea>
    </div>


    <script>
        const container = document.getElementById('workspaceContainer');
        const canvas = new fabric.Canvas('c', {
            width: container.clientWidth,
            height: container.clientHeight,
            backgroundColor: null,
            preserveObjectStacking: true,
            controlsAboveOverlay: true,
            fireRightClick: true,
            stopContextMenu: true
        });
        let cropRect = null;
        const CUSTOM_PROPS = ['sourceName', 'mediaType', 'origW', 'origH', 'selectable', 'evented', 'id', 'visible'];

        // --- 历史记录 ---
        let historyStack = [];
        let redoStack = [];
        let isHistoryProcessing = false;

        function saveHistory() {
            if (isHistoryProcessing) return;
            const json = JSON.stringify(canvas.toJSON(CUSTOM_PROPS));
            historyStack.push(json);
            if (historyStack.length > 20) historyStack.shift();
            redoStack = [];
            updateButtons();
            generateBatchCode();
        }

        function undo() {
            if (historyStack.length <= 1) return;
            isHistoryProcessing = true;
            redoStack.push(historyStack.pop());
            const state = historyStack[historyStack.length - 1];
            loadState(state);
        }

        function redo() {
            if (redoStack.length === 0) return;
            isHistoryProcessing = true;
            const state = redoStack.pop();
            historyStack.push(state);
            loadState(state);
        }

        function loadState(json) {
            canvas.loadFromJSON(json, () => {
                canvas.getObjects().forEach(o => {
                    if (o.type === 'rect' && o.stroke === '#ef4444') canvas.remove(o);
                });
                updateCropFrame(false);
                renderLayerList();
                updateRightPanel();
                isHistoryProcessing = false;
                updateButtons();
                generateBatchCode();
            });
        }

        function updateButtons() {
            document.getElementById('btnUndo').disabled = historyStack.length <= 1;
            document.getElementById('btnRedo').disabled = redoStack.length === 0;
        }

        // --- 事件监听 ---
        canvas.on('object:added', (e) => { if (e.target !== cropRect) saveHistory(); });
        canvas.on('object:modified', saveHistory);
        canvas.on('object:removed', saveHistory);
        saveHistory();

        // --- 交互功能 (Zoom, Pan, Move, Scale) ---
        canvas.on('mouse:wheel', function (opt) {
            var delta = opt.e.deltaY;
            var zoom = canvas.getZoom();
            zoom *= 0.999 ** delta;
            zoomCanvasToPoint(zoom, { x: opt.e.offsetX, y: opt.e.offsetY });
            opt.e.preventDefault();
            opt.e.stopPropagation();
        });

        let isDraggingCanvas = false;
        let lastPosX = 0;
        let lastPosY = 0;

        canvas.on('mouse:down', function (opt) {
            var evt = opt.e;
            if (evt.altKey === true) {
                isDraggingCanvas = true;
                canvas.selection = false;
                lastPosX = evt.clientX;
                lastPosY = evt.clientY;
                canvas.defaultCursor = 'grab';
            }
        });

        canvas.on('mouse:move', function (opt) {
            if (isDraggingCanvas) {
                var e = opt.e;
                var vpt = canvas.viewportTransform;
                vpt[4] += e.clientX - lastPosX;
                vpt[5] += e.clientY - lastPosY;
                canvas.requestRenderAll();
                lastPosX = e.clientX;
                lastPosY = e.clientY;
            }
        });

        canvas.on('mouse:up', function (opt) {
            if (isDraggingCanvas) {
                canvas.setViewportTransform(canvas.viewportTransform);
                isDraggingCanvas = false;
                canvas.selection = true;
                canvas.defaultCursor = 'default';
            }
        });

        window.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); undo(); return; }
            if ((e.ctrlKey || e.metaKey) && e.key === 'y') { e.preventDefault(); redo(); return; }
            if (e.key === 'Delete') { deleteActive(); return; }

            if (e.key === '=' || e.key === '+' || (e.key === '=' && e.ctrlKey)) {
                e.preventDefault(); zoomCanvasCenter(1.1); return;
            }
            if (e.key === '-' || (e.key === '-' && e.ctrlKey)) {
                e.preventDefault(); zoomCanvasCenter(0.9); return;
            }
            if (e.key === '0' && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                canvas.setViewportTransform([1, 0, 0, 1, 0, 0]);
                centerCropFrame();
                return;
            }

            const activeObj = canvas.getActiveObject();
            if (activeObj && activeObj !== cropRect) {
                const isShift = e.shiftKey;
                const moveStep = isShift ? 10 : 1;
                const scaleStep = isShift ? 0.1 : 0.01;

                let handled = false;
                if (e.key === 'ArrowUp') { activeObj.top -= moveStep; handled = true; }
                else if (e.key === 'ArrowDown') { activeObj.top += moveStep; handled = true; }
                else if (e.key === 'ArrowLeft') { activeObj.left -= moveStep; handled = true; }
                else if (e.key === 'ArrowRight') { activeObj.left += moveStep; handled = true; }
                else if (e.key === '[') {
                    activeObj.scale(Math.max(0.01, activeObj.scaleX - scaleStep));
                    handled = true;
                }
                else if (e.key === ']') {
                    activeObj.scale(activeObj.scaleX + scaleStep);
                    handled = true;
                }

                if (handled) {
                    e.preventDefault();
                    activeObj.setCoords();
                    canvas.requestRenderAll();
                    generateBatchCode();
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', '[', ']'].includes(e.key)) {
                saveHistory();
            }
        });

        function zoomCanvasToPoint(zoom, point) {
            if (zoom > 20) zoom = 20;
            if (zoom < 0.05) zoom = 0.05;
            canvas.zoomToPoint(point, zoom);
        }
        function zoomCanvasCenter(factor) {
            let zoom = canvas.getZoom();
            zoom *= factor;
            const center = canvas.getCenter();
            zoomCanvasToPoint(zoom, { x: center.left, y: center.top });
        }

        window.addEventListener('resize', () => {
            canvas.setWidth(container.clientWidth);
            canvas.setHeight(container.clientHeight);
            centerCropFrame();
        });

        // --- 裁剪框 ---
        function updateCropFrame(save = true) {
            const w = parseInt(document.getElementById('cropW').value) || 500;
            const h = parseInt(document.getElementById('cropH').value) || 500;
            canvas.getObjects().forEach(o => {
                if (o.type === 'rect' && o.excludeFromExport) canvas.remove(o);
            });
            cropRect = new fabric.Rect({
                width: w, height: h, fill: 'rgba(255, 255, 255, 0.05)',
                stroke: '#ef4444', strokeWidth: 2, strokeDashArray: [6, 6],
                selectable: false, evented: false, originX: 'center', originY: 'center',
                excludeFromExport: true
            });
            canvas.add(cropRect);
            if (!cropRect.left || !cropRect.top) centerCropFrame();
            if (save) saveHistory();
            generateBatchCode();
        }

        function centerCropFrame() {
            if (!cropRect) return;
            const vpt = canvas.viewportTransform;
            const centerX = (canvas.getWidth() / 2 - vpt[4]) / vpt[0];
            const centerY = (canvas.getHeight() / 2 - vpt[5]) / vpt[3];
            cropRect.left = centerX;
            cropRect.top = centerY;
            cropRect.setCoords();
            cropRect.bringToFront();
            canvas.requestRenderAll();
        }
        setTimeout(() => updateCropFrame(false), 100);

        // --- 上传处理 ---
        function handleUpload(files) {
            if (!files.length) return;
            Array.from(files).forEach(file => {
                const isVideo = file.type.startsWith('video');

                if (isVideo) {
                    const url = URL.createObjectURL(file);
                    const videoEl = document.createElement('video');
                    videoEl.style.display = 'none'; videoEl.muted = true; videoEl.crossOrigin = "anonymous";
                    videoEl.src = url;
                    document.body.appendChild(videoEl);
                    videoEl.onloadeddata = () => { videoEl.currentTime = 0.1; };
                    videoEl.onseeked = () => {
                        const w = videoEl.videoWidth; const h = videoEl.videoHeight;
                        const c = document.createElement('canvas'); c.width = w; c.height = h;
                        c.getContext('2d').drawImage(videoEl, 0, 0, w, h);
                        const thumbData = c.toDataURL();
                        fabric.Image.fromURL(thumbData, (img) => {
                            setupNewObject(img, file.name, 'video', w, h);
                        });
                        document.body.removeChild(videoEl);
                    };
                } else {
                    const reader = new FileReader();
                    reader.onload = (f) => {
                        const dataUrl = f.target.result;
                        fabric.Image.fromURL(dataUrl, (img) => {
                            setupNewObject(img, file.name, 'image', img.width, img.height);
                        });
                    };
                    reader.readAsDataURL(file);
                }
            });
            document.getElementById('fileInput').value = '';
        }

        function setupNewObject(obj, name, type, w, h) {
            obj.set({ originX: 'center', originY: 'center' });
            obj.sourceName = name;
            obj.mediaType = type;
            obj.origW = w;
            obj.origH = h;

            const rw = cropRect.width;
            const rh = cropRect.height;
            if (rw && rh) {
                const scale = Math.max(rw / w, rh / h);
                obj.scale(scale);
                obj.left = cropRect.left;
                obj.top = cropRect.top;
            }

            canvas.add(obj);
            obj.bringToFront();
            cropRect.bringToFront();
            canvas.setActiveObject(obj);
            renderLayerList();
        }

        // --- 项目保存/加载 ---
        function saveProject() {
            const data = {
                version: "1.1",
                settings: {
                    cropW: document.getElementById('cropW').value,
                    cropH: document.getElementById('cropH').value,
                    outputDir: document.getElementById('outputDir').value,
                    outSuffix: document.getElementById('outSuffix').value,
                    basePath: document.getElementById('basePath').value,
                    outExt: document.getElementById('outExt').value,
                    bgColor: document.getElementById('bgColor').value,
                    bgTransparent: document.getElementById('bgTransparent').checked
                },
                canvas: canvas.toJSON(CUSTOM_PROPS)
            };

            const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const exportName = document.getElementById('exportName').value.trim() || 'project';
            a.href = url;
            a.download = `${exportName}.json`;
            a.click();
        }

        function loadProject(input) {
            const file = input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.settings) {
                        document.getElementById('cropW').value = data.settings.cropW || 500;
                        document.getElementById('cropH').value = data.settings.cropH || 500;
                        document.getElementById('outputDir').value = data.settings.outputDir || "output";
                        document.getElementById('outSuffix').value = data.settings.outSuffix || "_crop";
                        document.getElementById('basePath').value = data.settings.basePath || "";
                        document.getElementById('outExt').value = data.settings.outExt || ".png";
                        if (data.settings.bgColor) document.getElementById('bgColor').value = data.settings.bgColor;
                        if (data.settings.bgTransparent !== undefined) document.getElementById('bgTransparent').checked = data.settings.bgTransparent;
                    }
                    canvas.clear();
                    canvas.loadFromJSON(data.canvas, () => {
                        canvas.getObjects().forEach(o => {
                            if (o.type === 'rect' && o.stroke === '#ef4444') canvas.remove(o);
                        });
                        updateCropFrame(false);
                        renderLayerList();
                        historyStack = [];
                        redoStack = [];
                        saveHistory();
                    });
                } catch (err) {
                    alert("parse error");
                }
            };
            reader.readAsText(file);
            input.value = '';
        }

        // --- 显隐与列表 ---
        function toggleVisibility(objIndex) {
            const allObjs = canvas.getObjects().filter(o => o !== cropRect);
            const targetObj = allObjs[allObjs.length - 1 - objIndex];
            if (targetObj) {
                targetObj.visible = !targetObj.visible;
                if (!targetObj.visible) canvas.discardActiveObject();
                canvas.requestRenderAll();
                renderLayerList();
                updateRightPanel();
                generateBatchCode();
            }
        }

        let dragSrcEl = null;
        function renderLayerList() {
            const list = document.getElementById('layerList');
            list.innerHTML = '';
            const allObjs = canvas.getObjects().filter(o => o !== cropRect);
            const displayList = [...allObjs].reverse();

            displayList.forEach((obj, index) => {
                const li = document.createElement('li');
                li.className = `layer-item ${obj === canvas.getActiveObject() ? 'active' : ''}`;
                if (!obj.visible) li.classList.add('hidden-layer');
                li.draggable = true;
                li._fabricObj = obj;
                const badge = obj.mediaType === 'video' ? '<span class="type-badge badge-vid">VID</span>' : '<span class="type-badge badge-img">IMG</span>';
                const eyeIcon = obj.visible ? '👁️' : '🚫';
                li.innerHTML = `
                <div class="layer-left" onclick="selectLayer(this)">
                    <span style="color:#666;font-size:16px;">☰</span>
                    <span class="layer-name" title="${obj.sourceName}">${obj.sourceName}</span>
                    ${badge}
                </div>
                <div class="layer-actions">
                    <span class="icon-btn" onclick="toggleVisibility(${index})" title="显隐">${eyeIcon}</span>
                </div>`;
                addDnDHandlers(li);
                list.appendChild(li);
            });
        }
        window.selectLayer = function (el) {
            const li = el.parentElement;
            const obj = li._fabricObj;
            if (obj.visible) {
                canvas.setActiveObject(obj);
                canvas.requestRenderAll();
            }
        };
        function addDnDHandlers(li) {
            li.addEventListener('dragstart', function (e) {
                this.classList.add('dragging'); dragSrcEl = this;
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/html', this.innerHTML);
            }, false);
            li.addEventListener('dragenter', function () { this.classList.add('over'); }, false);
            li.addEventListener('dragover', function (e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; return false; }, false);
            li.addEventListener('dragleave', function () { this.classList.remove('over'); }, false);
            li.addEventListener('drop', function (e) {
                e.stopPropagation();
                if (dragSrcEl !== this) {
                    const list = this.parentNode;
                    const rect = this.getBoundingClientRect();
                    const offset = e.clientY - rect.top;
                    (offset > rect.height / 2) ? list.insertBefore(dragSrcEl, this.nextSibling) : list.insertBefore(dragSrcEl, this);
                    syncFabricOrderFromDOM();
                }
                return false;
            }, false);
            li.addEventListener('dragend', function () {
                this.classList.remove('dragging');
                document.querySelectorAll('.layer-item').forEach(item => item.classList.remove('over'));
            }, false);
        }
        function syncFabricOrderFromDOM() {
            const listItems = document.querySelectorAll('.layer-item');
            const reversedItems = [...listItems].reverse();
            reversedItems.forEach((li, index) => { if (li._fabricObj) li._fabricObj.moveTo(index); });
            cropRect.bringToFront();
            canvas.requestRenderAll();
            saveHistory();
        }

        function applyPreset(type) {
            const obj = canvas.getActiveObject();
            if (!obj || obj === cropRect) return;
            const rw = cropRect.width; const rh = cropRect.height;
            const cw = obj.width; const ch = obj.height;
            if (type === 'reset') { obj.scaleX = 1; obj.scaleY = 1; }
            else if (type === 'fill') obj.scale(Math.max(rw / cw, rh / ch));
            else if (type === 'fit') obj.scale(Math.min(rw / cw, rh / ch));
            else if (type === 'w_fill') obj.scaleToWidth(rw);
            else if (type === 'h_fill') obj.scaleToHeight(rh);
            else if (type === 'center') { obj.left = cropRect.left; obj.top = cropRect.top; }
            obj.setCoords(); canvas.requestRenderAll(); saveHistory();
        }

        function updateRightPanel() {
            const obj = canvas.getActiveObject();
            const panel = document.getElementById('rightPanel');
            if (obj && obj !== cropRect && obj.visible) {
                panel.style.display = 'flex';
                document.getElementById('activeObjectName').innerText = obj.sourceName;
                document.querySelectorAll('.layer-item').forEach(li => {
                    if (li._fabricObj === obj) li.classList.add('active'); else li.classList.remove('active');
                });
            } else {
                panel.style.display = 'none';
                document.querySelectorAll('.layer-item').forEach(li => li.classList.remove('active'));
            }
        }
        canvas.on('selection:created', updateRightPanel);
        canvas.on('selection:updated', updateRightPanel);
        canvas.on('selection:cleared', updateRightPanel);
        canvas.on('object:added', (e) => { if (e.target !== cropRect) renderLayerList(); });
        canvas.on('object:removed', (e) => { if (e.target !== cropRect) renderLayerList(); });

        function deleteActive() {
            const active = canvas.getActiveObject();
            if (active && active !== cropRect) { canvas.remove(active); canvas.discardActiveObject(); updateRightPanel(); }
        }
        function copyCode() { document.getElementById('ffmpegCommandInput').select(); document.execCommand('copy'); }

        // --- 代码生成 (核心逻辑) ---
        function generateBatchCode() {
            const objs = canvas.getObjects().filter(o => o !== cropRect && o.visible);
            const outputBox = document.getElementById('ffmpegCommandInput');
            if (!objs.length) { outputBox.value = ""; outputBox.placeholder = "Wait Media"; return; }

            // 1. 获取基本参数
            const cropW = parseInt(document.getElementById('cropW').value);
            const cropH = parseInt(document.getElementById('cropH').value);
            const userExt = document.getElementById('outExt').value;
            const outputDirName = document.getElementById('outputDir').value.trim() || 'output';
            const outSuffix = document.getElementById('outSuffix').value;
            let basePath = document.getElementById('basePath').value.trim();
            if (basePath && !basePath.endsWith('\\') && !basePath.endsWith('/')) basePath += basePath.includes('\\') ? '\\' : '/';

            // 2. 获取颜色设置
            const bgColorHex = document.getElementById('bgColor').value;
            const isTransparent = document.getElementById('bgTransparent').checked;

            // 判断是否强制不透明 (MP4, JPG 不支持透明通道)
            const forceOpaque = ['.mp4', '.jpg', '.jpeg'].includes(userExt);

            // 构建 FFmpeg 颜色字符串
            // 如果允许透明且勾选了透明 -> 0x00000000
            // 否则 -> 使用 Hex 颜色
            let ffmpegColor = bgColorHex;
            if (!forceOpaque && isTransparent) {
                ffmpegColor = '0x00000000';
            }

            let commands = [];
            const isWin = basePath.includes('\\');
            commands.push(isWin ? `if not exist "${outputDirName}" md "${outputDirName}"` : `mkdir -p "${outputDirName}"`);
            commands.push("");

            objs.forEach(obj => {
                const fileName = obj.sourceName;
                const fileBaseName = fileName.replace(/\.[^/.]+$/, "");
                const isVideo = (obj.mediaType === 'video');
                let finalExt = userExt;

                // 坐标计算
                const scaleW = Math.round(obj.width * obj.scaleX);
                const scaleH = Math.round(obj.height * obj.scaleY);
                const objAbsLeft = obj.left - (scaleW / 2);
                const objAbsTop = obj.top - (scaleH / 2);
                const frameAbsLeft = cropRect.left - (cropRect.width / 2);
                const frameAbsTop = cropRect.top - (cropRect.height / 2);
                const overlayX = Math.round(objAbsLeft - frameAbsLeft);
                const overlayY = Math.round(objAbsTop - frameAbsTop);

                const inputPath = `"${basePath}${fileName}"`;
                const outputPath = `"${basePath}${outputDirName}/${fileBaseName}${outSuffix}${finalExt}"`;

                // 滤镜构建
                const filter = `color=s=${cropW}x${cropH}:c=${ffmpegColor}[bg];[0:v]scale=${scaleW}:${scaleH}[img];[bg][img]overlay=${overlayX}:${overlayY}:shortest=1`;

                let cmd = "";
                if (isVideo) {
                    if (finalExt === '.webm') cmd = `ffmpeg -i ${inputPath} -filter_complex "${filter}" -c:v libvpx-vp9 -auto-alt-ref 0 -y ${outputPath}`;
                    else if (finalExt === '.mp4') cmd = `ffmpeg -i ${inputPath} -filter_complex "${filter}" -c:v libx264 -pix_fmt yuv420p -c:a aac -y ${outputPath}`;
                    else if (finalExt === '.mov') cmd = `ffmpeg -i ${inputPath} -filter_complex "${filter}" -c:v prores_ks -profile:v 4444 -pix_fmt yuva444p10le -c:a copy -y ${outputPath}`;
                    else if (finalExt === '.webp') cmd = `ffmpeg -i ${inputPath} -filter_complex "${filter}" -c:v libwebp -loop 0 -preset default -an -y ${outputPath}`;
                    else if (finalExt === '.png') cmd = `ffmpeg -i ${inputPath} -filter_complex "${filter}" -y ${outputPath}`; // 视频转序列帧
                } else {
                    if (finalExt === '.webp') cmd = `ffmpeg -i ${inputPath} -filter_complex "${filter}" -c:v libwebp -y ${outputPath}`;
                    else cmd = `ffmpeg -i ${inputPath} -filter_complex "${filter}" -frames:v 1 -y ${outputPath}`;
                }
                commands.push(cmd);
            });
            outputBox.value = commands.join("\n");
        }
    </script>
    <!-- 引入 VS Code 通信脚本 -->
    <script src="/script/vscode-bridge.js"></script>
    <script>
        window.navbarConfig = {
            browserUrl: location.href // 点击 Browsers 按钮时通过 Bridge 发送此 URL
        };
    </script>
