<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFmpeg 切片工坊</title>
    <style>
        :root {
            --bg-color: #1e1e2e;
            --card-bg: #313244;
            --text-color: #cdd6f4;
            --accent: #f9e2af;
            --blue: #89b4fa;
            --red: #f38ba8;
            --green: #a6e3a1;
            --border: #45475a;
            --input-bg: #181825;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-bottom: 20px;
            color: var(--accent);
        }

        .container {
            display: grid;
            grid-template-columns: minmax(340px, 420px) 1fr;
            gap: 20px;
            width: 100%;
            max-width: 1400px;
            align-items: start;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .card h3 {
            margin-top: 0;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            color: var(--accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .control-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9em;
            font-weight: 600;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 8px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        /* 预览区样式 */
        .video-wrapper {
            width: 100%;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 400px;
            border: 1px solid #444;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
        }

        #videoStage {
            position: relative;
            display: none;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            line-height: 0;
        }

        video {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* 裁剪框 */
        #cropBox {
            position: absolute;
            border: 2px solid var(--red);
            background: rgba(243, 139, 168, 0.2);
            display: none;
            cursor: move;
            z-index: 10;
            box-sizing: border-box;
        }

        .resize-handle {
            width: 14px;
            height: 14px;
            background: var(--red);
            position: absolute;
            bottom: -7px;
            right: -7px;
            cursor: se-resize;
            border-radius: 50%;
            z-index: 11;
            border: 2px solid #fff;
        }

        /* === 优化的时间轴控制区 === */
        .cut-controls {
            background: #181825;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            border: 1px solid var(--border);
        }

        .time-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 15px;
        }

        .time-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            background: #252636;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #3b3c50;
        }

        .time-label {
            font-size: 0.85em;
            color: #aaa;
            display: flex;
            justify-content: space-between;
        }

        .time-input-row {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* 时间输入框 */
        input.time-input {
            font-family: 'Consolas', monospace;
            font-size: 1.1em;
            text-align: center;
            color: var(--accent);
            background: #11111b;
            border: 1px solid #45475a;
            padding: 6px;
            width: 100%;
        }

        .btn-nudge {
            padding: 4px 8px;
            font-size: 0.8em;
            background: #313244;
            color: #fff;
            border: 1px solid #555;
            cursor: pointer;
            border-radius: 4px;
            min-width: 32px;
        }

        .btn-nudge:hover {
            background: #45475a;
        }

        .btn-set-current {
            background: transparent;
            border: 1px solid var(--blue);
            color: var(--blue);
            border-radius: 4px;
            padding: 2px 8px;
            font-size: 0.8em;
            cursor: pointer;
        }

        .btn-set-current:hover {
            background: rgba(137, 180, 250, 0.1);
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 10px;
            border-top: 1px solid #333;
        }

        /* 列表与按钮 */
        .segment-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 15px;
            max-height: 350px;
            overflow-y: auto;
        }

        .segment-item {
            background: #45475a;
            padding: 10px;
            border-radius: 6px;
            border-left: 4px solid var(--green);
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
            align-items: center;
        }

        .segment-item.editing {
            background: #585b70;
            border-left: 4px solid var(--red);
        }

        .tag {
            display: inline-block;
            padding: 2px 5px;
            border-radius: 3px;
            font-size: 0.75em;
            margin-right: 5px;
            background: #313244;
            color: #fff;
            border: 1px solid #666;
        }

        .btn {
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            border: none;
            color: #1e1e2e;
            transition: 0.2s;
        }

        .btn:hover {
            filter: brightness(1.1);
        }

        .btn-sm {
            padding: 4px 10px;
            font-size: 0.85em;
        }

        .btn-green {
            background: var(--green);
        }

        .btn-red {
            background: var(--red);
        }

        .btn-blue {
            background: var(--blue);
        }

        .btn-gray {
            background: #6c7086;
            color: #fff;
        }

        .btn-purple {
            background: #cba6f7;
            color: #1e1e2e;
        }

        textarea {
            width: 100%;
            height: 150px;
            background: #11111b;
            color: #a6e3a1;
            font-family: 'Consolas', monospace;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
            resize: vertical;
            box-sizing: border-box;
            margin-top: 10px;
            white-space: pre;
            overflow-x: auto;
        }

        .hidden {
            display: none !important;
        }

        .hint {
            font-size: 0.8em;
            color: #999;
            margin-top: 5px;
        }

        .playing-indicator {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: var(--green);
            padding: 5px 10px;
            border-radius: 4px;
            font-weight: bold;
            display: none;
            z-index: 20;
            pointer-events: none;
        }
    </style>
  <script async src="/ga.js"></script>
  </head>

<body>

    <h1>FFmpeg 切片工坊 <small style="font-size:0.5em; opacity:0.7">v4.1 微调版</small></h1>

    <div class="container">
        <!-- 左侧设置 -->
        <div class="controls-col">
            <div class="card">
                <h3>📂 1. 输入文件</h3>
                <div class="control-group">
                    <input type="file" id="fileInput">
                </div>
                <div class="control-group">
                    <label>文件名</label>
                    <input type="text" id="inputPath" value="input.mp4">
                </div>
                <div class="control-group">
                    <label>输出前缀</label>
                    <input type="text" id="outputPrefix" value="output" placeholder="例如 video">
                </div>
            </div>

            <div class="card" id="settingsCard" style="border-color: var(--green);">
                <h3 id="settingsTitle">⚙️ 2. 片段参数配置</h3>

                <div class="control-group" style="margin-top:15px;">
                    <label>画面缩放 (Scale)</label>
                    <select id="scaleType">
                        <option value="original">原始大小 (Original)</option>
                        <option value="1920:-2">1080p (宽度固定)</option>
                        <option value="1280:-2">720p (宽度固定)</option>
                        <option value="-2:1080">1080p (高度固定)</option>
                        <option value="custom">自定义 (w:h)...</option>
                    </select>
                    <input type="text" id="customScaleInput" class="hidden" placeholder="例: 640:480"
                        style="margin-top: 5px;">
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="enableCrop">
                    <label for="enableCrop">启用画面裁剪 (Crop)</label>
                </div>

                <div id="cropSettings" class="hidden">
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:5px;">
                        <div><label style="font-size:0.8em">宽 (W)</label><input type="number" id="cropW"
                                oninput="syncBoxFromInput()"></div>
                        <div><label style="font-size:0.8em">高 (H)</label><input type="number" id="cropH"
                                oninput="syncBoxFromInput()"></div>
                        <div><label style="font-size:0.8em">X 坐标</label><input type="number" id="cropX"
                                oninput="syncBoxFromInput()"></div>
                        <div><label style="font-size:0.8em">Y 坐标</label><input type="number" id="cropY"
                                oninput="syncBoxFromInput()"></div>
                    </div>
                    <div class="hint">⚠️ 提示: 这里的数值是真实分辨率坐标</div>
                </div>

                <div class="control-group" style="margin-top:15px; padding-top:10px; border-top:1px dashed #555;">
                    <label>全局编码器</label>
                    <select id="vCodec">
                        <option value="libx264">H.264 (推荐)</option>
                        <option value="libx265">H.265</option>
                        <option value="h264_nvenc">NVIDIA H.264</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- 右侧预览与操作 -->
        <div class="preview-col">
            <div class="card">
                <h3>
                    👁️ 预览与时间轴
                    <div style="display:inline-block;">
                        <button class="btn btn-sm btn-gray hidden" id="exitEditBtn" onclick="exitEditMode()">➜
                            退出修改</button>
                    </div>
                </h3>

                <div class="video-wrapper" id="videoWrapper">
                    <div id="placeholder" style="color:#666;">请先选择视频文件...</div>
                    <div id="videoStage">
                        <video id="previewVideo" controls></video>
                        <div id="cropBox">
                            <div class="resize-handle"></div>
                        </div>
                        <div id="playIndicator" class="playing-indicator">▶ 正在预览片段...</div>
                    </div>
                </div>

                <!-- 优化后的剪辑控制区 -->
                <div id="cutSection" class="cut-controls hidden">

                    <div class="time-panel">
                        <!-- 起点控制 -->
                        <div class="time-group">
                            <div class="time-label">
                                <span>[ 起点 Start ]</span>
                                <button class="btn-set-current" onclick="setFromVideo('in')">📍 读取当前位置</button>
                            </div>
                            <div class="time-input-row">
                                <button class="btn-nudge" onclick="nudgeTime('in', -1)" title="-1秒">«</button>
                                <button class="btn-nudge" onclick="nudgeTime('in', -0.1)" title="-0.1秒">‹</button>
                                <input type="text" class="time-input" id="inpStart" value="00:00:00.000"
                                    onchange="manualInput('in')">
                                <button class="btn-nudge" onclick="nudgeTime('in', 0.1)" title="+0.1秒">›</button>
                                <button class="btn-nudge" onclick="nudgeTime('in', 1)" title="+1秒">»</button>
                            </div>
                        </div>

                        <!-- 终点控制 -->
                        <div class="time-group">
                            <div class="time-label">
                                <span>[ 终点 End ]</span>
                                <button class="btn-set-current" onclick="setFromVideo('out')">📍 读取当前位置</button>
                            </div>
                            <div class="time-input-row">
                                <button class="btn-nudge" onclick="nudgeTime('out', -1)" title="-1秒">«</button>
                                <button class="btn-nudge" onclick="nudgeTime('out', -0.1)" title="-0.1秒">‹</button>
                                <input type="text" class="time-input" id="inpEnd" value="00:00:00.000"
                                    onchange="manualInput('out')">
                                <button class="btn-nudge" onclick="nudgeTime('out', 0.1)" title="+0.1秒">›</button>
                                <button class="btn-nudge" onclick="nudgeTime('out', 1)" title="+1秒">»</button>
                            </div>
                        </div>
                    </div>

                    <div class="action-bar">
                        <button class="btn btn-purple btn-sm" onclick="previewRange()">▶ 预览区间</button>
                        <div style="display:flex; gap:10px;">
                            <button id="addBtn" class="btn btn-green" onclick="addSegment()">+ 添加到列表</button>
                            <button id="saveBtn" class="btn btn-red hidden" onclick="saveEdit()">💾 保存修改</button>
                        </div>
                    </div>

                    <div class="segment-list" id="segmentList"></div>
                </div>
            </div>

            <div class="card">
                <h3>🚀 生成的命令</h3>
                <textarea id="result" readonly>请先添加片段...</textarea>
                <div style="margin-top:10px; display:flex; justify-content:flex-end; gap:10px;">
                    <button class="btn btn-blue" onclick="copyCommand()">复制全部命令</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // DOM Elements
        const els = {
            file: document.getElementById('fileInput'),
            video: document.getElementById('previewVideo'),
            stage: document.getElementById('videoStage'),
            cropBox: document.getElementById('cropBox'),
            enableCrop: document.getElementById('enableCrop'),
            cutSection: document.getElementById('cutSection'),
            segmentList: document.getElementById('segmentList'),
            inpStart: document.getElementById('inpStart'),
            inpEnd: document.getElementById('inpEnd'),
            result: document.getElementById('result'),
            playIndicator: document.getElementById('playIndicator'),
            addBtn: document.getElementById('addBtn'),
            saveBtn: document.getElementById('saveBtn'),
            exitEditBtn: document.getElementById('exitEditBtn'),
            settingsTitle: document.getElementById('settingsTitle'),
            settingsCard: document.getElementById('settingsCard'),
            scaleType: document.getElementById('scaleType'),
            customScaleInput: document.getElementById('customScaleInput'),
            cW: document.getElementById('cropW'), cH: document.getElementById('cropH'),
            cX: document.getElementById('cropX'), cY: document.getElementById('cropY')
        };

        let state = {
            origW: 0, origH: 0, displayedW: 0, displayedH: 0,
            segments: [],
            tempStart: 0,
            tempEnd: 0,
            previewTargetEnd: null,
            editingIndex: -1
        };

        // --- 1. 初始化 ---
        els.file.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            document.getElementById('inputPath').value = file.name;
            document.getElementById('outputPrefix').value = file.name.replace(/\.[^/.]+$/, "");
            els.video.src = URL.createObjectURL(file);
            document.getElementById('placeholder').style.display = 'none';
            els.cutSection.classList.remove('hidden');
            els.video.onloadedmetadata = () => {
                state.origW = els.video.videoWidth;
                state.origH = els.video.videoHeight;
                state.tempEnd = els.video.duration; // 默认选中全长
                state.tempStart = 0;
                updateTimeInputs(); // 初始化输入框显示
                adjustStageSize();
            };
        });

        window.addEventListener('resize', () => { if (els.video.src) adjustStageSize(); });

        function adjustStageSize() {
            const wrapperW = els.stage.parentElement.clientWidth - 40;
            const maxH = 600;
            const scale = Math.min(wrapperW / state.origW, maxH / state.origH);
            state.displayedW = state.origW * scale;
            state.displayedH = state.origH * scale;
            els.stage.style.display = 'block';
            els.stage.style.width = state.displayedW + 'px';
            els.stage.style.height = state.displayedH + 'px';
            if (els.enableCrop.checked) syncBoxFromInput();
        }

        // --- 2. 坐标核心逻辑 ---
        function getRatio() { return state.origW / state.displayedW; }

        function updateInputsFromBox() {
            const r = getRatio();
            const x = Math.max(0, els.cropBox.offsetLeft * r);
            const y = Math.max(0, els.cropBox.offsetTop * r);
            const w = els.cropBox.offsetWidth * r;
            const h = els.cropBox.offsetHeight * r;
            els.cX.value = Math.round(x); els.cY.value = Math.round(y);
            els.cW.value = Math.round(w); els.cH.value = Math.round(h);
        }

        window.syncBoxFromInput = function () {
            if (state.displayedW === 0) return;
            const r = 1 / getRatio();
            const w = parseInt(els.cW.value) || 0;
            const h = parseInt(els.cH.value) || 0;
            const x = parseInt(els.cX.value) || 0;
            const y = parseInt(els.cY.value) || 0;
            els.cropBox.style.width = (w * r) + 'px';
            els.cropBox.style.height = (h * r) + 'px';
            els.cropBox.style.left = (x * r) + 'px';
            els.cropBox.style.top = (y * r) + 'px';
        }

        els.enableCrop.addEventListener('change', (e) => {
            document.getElementById('cropSettings').classList.toggle('hidden', !e.target.checked);
            els.cropBox.style.display = e.target.checked ? 'block' : 'none';
            if (e.target.checked && state.editingIndex === -1) initDefaultCrop();
        });

        function initDefaultCrop() {
            els.cW.value = Math.floor(state.origW / 2); els.cH.value = Math.floor(state.origH / 2);
            els.cX.value = Math.floor(state.origW / 4); els.cY.value = Math.floor(state.origH / 4);
            syncBoxFromInput();
        }

        // --- 3. 拖拽逻辑 ---
        let isDrag = false, isResize = false, startX, startY, startRect;
        els.cropBox.addEventListener('mousedown', (e) => {
            e.preventDefault();
            isResize = e.target.classList.contains('resize-handle');
            isDrag = !isResize;
            startX = e.clientX; startY = e.clientY;
            startRect = { l: els.cropBox.offsetLeft, t: els.cropBox.offsetTop, w: els.cropBox.offsetWidth, h: els.cropBox.offsetHeight };
            document.addEventListener('mousemove', onMove);
            document.addEventListener('mouseup', onUp);
        });

        function onMove(e) {
            const dx = e.clientX - startX; const dy = e.clientY - startY;
            if (isDrag) {
                let l = Math.max(0, Math.min(startRect.l + dx, state.displayedW - startRect.w));
                let t = Math.max(0, Math.min(startRect.t + dy, state.displayedH - startRect.h));
                els.cropBox.style.left = l + 'px'; els.cropBox.style.top = t + 'px';
            } else if (isResize) {
                let w = Math.max(20, startRect.w + dx);
                let h = Math.max(20, startRect.h + dy);
                if (els.cropBox.offsetLeft + w > state.displayedW) w = state.displayedW - els.cropBox.offsetLeft;
                if (els.cropBox.offsetTop + h > state.displayedH) h = state.displayedH - els.cropBox.offsetTop;
                els.cropBox.style.width = w + 'px'; els.cropBox.style.height = h + 'px';
            }
            updateInputsFromBox();
        }
        function onUp() { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); updateInputsFromBox(); }


        // --- 4. 时间与微调核心逻辑 (新功能) ---

        // 格式化时间为 HH:MM:SS.mmm
        function formatTimeFull(seconds) {
            const date = new Date(seconds * 1000);
            const hh = String(Math.floor(seconds / 3600)).padStart(2, '0');
            const mm = String(date.getUTCMinutes()).padStart(2, '0');
            const ss = String(date.getUTCSeconds()).padStart(2, '0');
            const ms = String(date.getUTCMilliseconds()).padStart(3, '0');
            return `${hh}:${mm}:${ss}.${ms}`;
        }

        // 解析时间字符串为秒
        function parseTimeStr(str) {
            const parts = str.split(':');
            let sec = 0;
            if (parts.length === 3) {
                sec += parseInt(parts[0]) * 3600;
                sec += parseInt(parts[1]) * 60;
                sec += parseFloat(parts[2]);
            } else if (parts.length === 2) {
                sec += parseInt(parts[0]) * 60;
                sec += parseFloat(parts[1]);
            } else {
                sec = parseFloat(str);
            }
            return isNaN(sec) ? 0 : sec;
        }

        // 从视频当前位置读取
        window.setFromVideo = function (type) {
            const t = els.video.currentTime;
            if (type === 'in') state.tempStart = t;
            else state.tempEnd = t;
            updateTimeInputs();
        };

        // 微调按钮逻辑
        window.nudgeTime = function (type, delta) {
            if (type === 'in') {
                state.tempStart = Math.max(0, state.tempStart + delta);
                els.video.currentTime = state.tempStart;
            } else {
                state.tempEnd = Math.max(0, state.tempEnd + delta);
                els.video.currentTime = state.tempStart;
            }
            updateTimeInputs();
            // els.video.play();
        };

        // 手动修改输入框
        window.manualInput = function (type) {
            if (type === 'in') {
                state.tempStart = parseTimeStr(els.inpStart.value);
            } else {
                state.tempEnd = parseTimeStr(els.inpEnd.value);
            }
            // 重新格式化一下，确保格式统一
            updateTimeInputs();
        };

        // 更新界面上的输入框值
        function updateTimeInputs() {
            els.inpStart.value = formatTimeFull(state.tempStart);
            els.inpEnd.value = formatTimeFull(state.tempEnd);
        }

        // 预览设定的区间
        window.previewRange = function () {
            if (state.tempStart >= state.tempEnd) {
                alert("起点时间必须小于终点时间！");
                return;
            }
            els.video.currentTime = state.tempStart;
            state.previewTargetEnd = state.tempEnd;
            els.video.play();
        };


        // --- 5. 数据存储与列表渲染 ---
        function getSnapshot() {
            if (state.tempStart >= state.tempEnd) { alert("错误：开始时间必须小于结束时间"); return null; }
            let crop = null;
            if (els.enableCrop.checked) {
                crop = { w: parseInt(els.cW.value) || 0, h: parseInt(els.cH.value) || 0, x: parseInt(els.cX.value) || 0, y: parseInt(els.cY.value) || 0 };
            }
            let scale = els.scaleType.value === 'custom' ? (els.customScaleInput.value.trim() || 'original') : els.scaleType.value;
            // 存储时保留3位小数精度
            return JSON.parse(JSON.stringify({ start: parseFloat(state.tempStart.toFixed(3)), end: parseFloat(state.tempEnd.toFixed(3)), crop, scale }));
        }

        window.addSegment = function () {
            const seg = getSnapshot(); if (!seg) return;
            state.segments.push(seg);
            state.segments.sort((a, b) => a.start - b.start);
            renderSegments(); generateBatchCommands();
        };

        window.saveEdit = function () {
            if (state.editingIndex === -1) return;
            const seg = getSnapshot(); if (!seg) return;
            state.segments[state.editingIndex] = seg;
            exitEditMode();
            state.segments.sort((a, b) => a.start - b.start);
            renderSegments(); generateBatchCommands();
        };

        window.editSegment = function (idx) {
            const seg = state.segments[idx];
            state.editingIndex = idx;
            // 加载数据到临时状态
            state.tempStart = seg.start;
            state.tempEnd = seg.end;
            updateTimeInputs(); // 更新输入框

            els.video.currentTime = seg.start; els.video.pause();

            if (seg.crop) {
                els.enableCrop.checked = true; els.cropBox.style.display = 'block';
                document.getElementById('cropSettings').classList.remove('hidden');
                els.cW.value = seg.crop.w; els.cH.value = seg.crop.h; els.cX.value = seg.crop.x; els.cY.value = seg.crop.y;
                syncBoxFromInput();
            } else {
                els.enableCrop.checked = false; els.cropBox.style.display = 'none';
                document.getElementById('cropSettings').classList.add('hidden');
            }

            const opts = Array.from(els.scaleType.options).map(o => o.value);
            if (opts.includes(seg.scale) && seg.scale !== 'custom') {
                els.scaleType.value = seg.scale; els.customScaleInput.classList.add('hidden');
            } else {
                els.scaleType.value = 'custom'; els.customScaleInput.value = seg.scale === 'original' ? '' : seg.scale;
                els.customScaleInput.classList.remove('hidden');
            }

            els.addBtn.classList.add('hidden');
            els.saveBtn.classList.remove('hidden');
            els.exitEditBtn.classList.remove('hidden');
            els.settingsTitle.textContent = `⚙️ 正在编辑: 片段 ${idx + 1}`;
            els.settingsCard.style.borderColor = "#f38ba8";
            renderSegments();
        };

        window.exitEditMode = function () {
            state.editingIndex = -1;
            els.addBtn.classList.remove('hidden');
            els.saveBtn.classList.add('hidden');
            els.exitEditBtn.classList.add('hidden');
            els.settingsTitle.textContent = "⚙️ 2. 片段参数配置";
            els.settingsCard.style.borderColor = "#a6e3a1";
            renderSegments();
        };

        function renderSegments() {
            els.segmentList.innerHTML = '';
            state.segments.forEach((seg, idx) => {
                const el = document.createElement('div');
                el.className = 'segment-item';
                if (idx === state.editingIndex) el.classList.add('editing');
                let tags = '';
                if (seg.crop) tags += `<span class="tag">Crop: ${seg.crop.w}x${seg.crop.h}</span>`;
                if (seg.scale && seg.scale !== 'original') tags += `<span class="tag">Scale: ${seg.scale}</span>`;
                if (!tags) tags = `<span class="tag" style="opacity:0.5">无处理</span>`;

                el.innerHTML = `
                    <div class="seg-info">
                        <div style="font-weight:bold; color:#fff; margin-bottom:4px;">${idx === state.editingIndex ? '📝 编辑中...' : `片段 ${idx + 1}`}</div>
                        <div style="font-family:monospace; color:var(--accent);">${formatTimeFull(seg.start)} - ${formatTimeFull(seg.end)}</div>
                        <div style="margin-top:4px;">${tags}</div>
                    </div>
                    <div class="seg-actions">
                        <button class="btn btn-outline btn-sm" onclick="previewSegment(${idx})">▶</button>
                        <button class="btn btn-blue btn-sm" onclick="editSegment(${idx})">✎</button>
                        <button class="btn btn-red btn-sm" onclick="removeSegment(${idx})">×</button>
                    </div>
                `;
                els.segmentList.appendChild(el);
            });
        }

        // Utils & Loop Check
        els.video.addEventListener('timeupdate', () => {
            if (state.previewTargetEnd !== null && els.video.currentTime >= state.previewTargetEnd) {
                els.video.pause();
                state.previewTargetEnd = null;
                els.playIndicator.style.display = 'none';
            } else if (state.previewTargetEnd !== null) {
                els.playIndicator.style.display = 'block';
            }
        });
        els.scaleType.addEventListener('change', function () { els.customScaleInput.classList.toggle('hidden', this.value !== 'custom'); });

        window.previewSegment = function (idx) { const seg = state.segments[idx]; els.video.currentTime = seg.start; state.previewTargetEnd = seg.end; els.video.play(); };
        window.removeSegment = function (idx) { if (idx === state.editingIndex) exitEditMode(); state.segments.splice(idx, 1); renderSegments(); generateBatchCommands(); };

        window.generateBatchCommands = function () {
            const inputPath = document.getElementById('inputPath').value.trim() || 'input.mp4';
            const outputPrefix = document.getElementById('outputPrefix').value.trim() || 'output';
            const vCodec = document.getElementById('vCodec').value;
            let commands = [];
            state.segments.forEach((seg, idx) => {
                const partName = `${outputPrefix}_part${idx + 1}.mp4`;
                const s = seg.start.toFixed(3);
                const e = seg.end.toFixed(3);
                let vf = [];
                if (seg.crop) vf.push(`crop=${seg.crop.w}:${seg.crop.h}:${seg.crop.x}:${seg.crop.y}`);
                if (seg.scale && seg.scale !== 'original') vf.push(`scale=${seg.scale}`);
                const filterStr = vf.length > 0 ? `-vf "${vf.join(',')}"` : '';
                // 推荐使用 medium preset 平衡速度与质量
                const encodeParams = `-c:v ${vCodec} -c:a aac -preset medium -crf 23`;
                // 使用 -ss -to 精确剪切
                commands.push(`ffmpeg -y -ss ${s} -to ${e} -i "${inputPath}" ${encodeParams} ${filterStr} "${partName}"`);
            });
            els.result.value = commands.join('\n\n') || "# 请添加至少一个片段...";
        }
        window.copyCommand = function () { els.result.select(); document.execCommand('copy'); }
    </script>
</body>

</html>
