<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, follow" />
    <title>页面不存在 · AGI Code Hub</title>
    <link rel="icon" href="/favicon.ico" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f7f8fa;
        --fg: #1f2328;
        --dim: #6b7280;
        --brand: #0058a0;
        --card: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111417;
          --fg: #e6e8ea;
          --dim: #9aa3ad;
          --brand: #63b3ed;
          --card: #1a1e22;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.7 -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      }
      main {
        width: 100%;
        max-width: 560px;
        background: var(--card);
        border-radius: 16px;
        padding: 40px 32px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
      }
      .code {
        font-size: 56px;
        font-weight: 800;
        letter-spacing: -2px;
        color: var(--brand);
        line-height: 1;
      }
      h1 { font-size: 20px; margin: 16px 0 8px; }
      p { margin: 0 0 8px; color: var(--dim); }
      nav { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 10px; }
      a {
        display: inline-block;
        padding: 9px 16px;
        border-radius: 9px;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
        background: var(--brand);
        color: #fff;
      }
      a.ghost {
        background: transparent;
        color: var(--brand);
        border: 1px solid color-mix(in srgb, var(--brand) 40%, transparent);
      }
      .path {
        margin-top: 18px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12.5px;
        color: var(--dim);
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="code">404</div>
      <h1>这个地址没有内容</h1>
      <p>链接可能已经失效，或者页面被合并到了别处。</p>
      <p>This page doesn't exist — it may have moved or been removed.</p>
      <div class="path" id="path"></div>
      <nav>
        <a href="/">回工具箱首页</a>
        <a class="ghost" href="/docs/">看文档</a>
        <a class="ghost" href="/blog/">读博客</a>
      </nav>
    </main>
    <script>
      // 把请求路径显示出来，方便用户在站内自查是不是手输错误
      var el = document.getElementById('path');
      if (el) el.textContent = location.pathname + location.search;
    </script>
  </body>
</html>
